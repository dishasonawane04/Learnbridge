<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archived Chats - LearnBridge</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #8b5cf6;
            --border-color: #334155;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }

        h1 {
            font-size: 1.8rem;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 500;
            transition: color 0.2s;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
        }

        .back-link:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.1);
        }

        .archive-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .archive-item {
            background: var(--bg-card);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s, border-color 0.2s;
        }

        .archive-item:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .chat-info h3 {
            margin: 0 0 0.5rem 0;
            font-size: 1.1rem;
            color: var(--text-main);
        }

        .chat-info p {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .restore-btn {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .restore-btn:hover {
            background: var(--accent);
            color: white;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px dashed var(--border-color);
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <h1><i class="ph ph-archive"></i> Archived Chats</h1>
            <a href="{% url 'ai_tutor:tutor_home' %}" class="back-link">
                <i class="ph ph-arrow-left"></i> Back to Tutor
            </a>
        </header>

        <div class="archive-list">
            {% for chat in chats %}
            <div class="archive-item">
                <div class="chat-info">
                    <h3>{{ chat.title }}</h3>
                    <p>Last active: {{ chat.updated_at|date:"M d, Y" }}</p>
                </div>
                <button onclick="restoreChat('{{ chat.id }}')" class="restore-btn">
                    <i class="ph ph-arrow-u-up-left"></i> Restore
                </button>
            </div>
            {% empty %}
            <div class="empty-state">
                <i class="ph ph-tray" style="font-size: 3rem; opacity: 0.5; margin-bottom: 1rem;"></i>
                <p>No archived chats found.</p>
            </div>
            {% endfor %}
        </div>
    </div>

    <script>
        async function restoreChat(chatId) {
            if (!confirm("Restore this chat to your active list?")) return;

            try {
                const response = await fetch(`/ai/api/chat/${chatId}/archive/`, {
                    method: 'POST',
                    headers: { 'X-CSRFToken': '{{ csrf_token }}' }
                });
                if (response.ok) {
                    window.location.reload();
                }
            } catch (err) {
                console.error("Failed to restore", err);
                alert("Failed to restore chat.");
            }
        }
    </script>
</body>

</html>
