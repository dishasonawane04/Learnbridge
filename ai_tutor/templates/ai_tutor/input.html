<!DOCTYPE html>
<html>
<head>
    <title>AI Tutor Input</title>
</head>
<body>
    <h2>Ask AI Tutor</h2>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <label>Ask a question:</label><br>
        <textarea name="question" rows="4" cols="50"></textarea><br><br>

        <label>Upload an image (optional):</label><br>
        <input type="file" name="image"><br><br>

        <button type="submit">Submit</button>
    </form>

    {% if response %}
        <h3>AI Response:</h3>
        <p>{{ response }}</p>
    {% endif %}
</body>
</html>
