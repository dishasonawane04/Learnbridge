{% extends "quiz/base.html" %}

{% block content %}
<div style="padding: 2rem 0; max-width: 900px; margin: 0 auto;">
    <div style="text-align: center; margin-bottom: 3rem;">
        <h1 style="font-size: 2.5rem; color: white;">Learning Support</h1>
        <p style="color: var(--text-light); font-size: 1.1rem;">"I don't understand" — That's okay! Let's break it down
            together.</p>
    </div>

    <div class="card" style="padding: 2.5rem; background: rgba(30, 41, 59, 0.6);">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div style="margin-bottom: 2rem;">
                <label
                    style="display: block; color: var(--text-light); margin-bottom: 0.8rem; font-size: 1rem;">Describe
                    your doubt or upload an image</label>
                <textarea name="doubt" placeholder="e.g., 'I'm struggling with the concept of recursion in Python...'"
                    style="width: 100%; height: 120px; padding: 1rem; background: rgba(15, 23, 42, 0.5); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: white; outline: none; transition: border-color 0.2s;"></textarea>
            </div>

            <div style="margin-bottom: 2rem;">
                <label
                    style="display: block; color: var(--text-light); margin-bottom: 0.8rem; font-size: 0.9rem;">Upload
                    Image (Textbook, Graph, or Formula)</label>
                <input type="file" name="image" accept="image/*" style="color: var(--text-light);">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem; font-weight: 600;">
                Get Simplified Explanation
            </button>
        </form>
    </div>

    {% if response %}
    <div id="response-section" class="card"
        style="margin-top: 2rem; padding: 2.5rem; border-left: 6px solid var(--secondary);">
        <h3 style="color: var(--secondary); margin-top: 0;">Simplified Breakdown</h3>
        {% if image_url %}
        <div
            style="margin-bottom: 1.5rem; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1);">
            <img src="{{ image_url }}" alt="Uploaded doubt" style="max-width: 100%; height: auto; display: block;">
        </div>
        {% endif %}
        <div style="line-height: 1.8; color: var(--text-main); white-space: pre-line;">
            {{ response }}
        </div>

        <div style="margin-top: 3rem; display: flex; gap: 1rem; justify-content: center;">
            <a href="{% url 'quiz_subjects' %}" class="btn btn-secondary">Back to Quiz</a>
            <a href="{% url 'notes' %}?topic={{ topic }}" class="btn btn-primary">Generate Notes</a>
        </div>
    </div>
    {% endif %}
</div>

<style>
    textarea:focus {
        border-color: var(--primary) !important;
        box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
    }
</style>
{% endblock %}
