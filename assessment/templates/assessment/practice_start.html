{% extends "base.html" %}

{% block content %}
<div class="container" style="max-width: 800px; margin: 4rem auto; text-align: center;">
    {% if error %}
    <div class="alert alert-danger" style="margin-bottom: 2rem;">
        Failed to generate practice test: {{ error }}
    </div>
    <a href="{% url 'course:course_dashboard' course.id %}" class="btn btn-primary">Return to Dashboard</a>
    {% else %}
    <div class="glass-card fade-in" style="padding: 4rem; border: 1px solid rgba(255,255,255,0.1);">
        <div class="spinner"
            style="width: 50px; height: 50px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 2rem;">
        </div>
        <h2 style="color: white; margin-bottom: 1rem;">Generating Practice Test</h2>
        <p style="color: var(--text-light); text-align: center;">Analyzing notes for {{ course.title }} to create MCQs
            and Short Answer questions...</p>
    </div>
    <script>
        // We are likely redirected here on error, but typically the backend view handles the wait and redirects directly to test.
        // If we land here, it means we are either erroring or waiting. The view currently blocks until generation is done.
        // So we only see this if we explicitly rendered it.
    </script>
    <style>
        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
    {% endif %}
</div>
{% endblock %}
