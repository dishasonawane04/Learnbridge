{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="login-wrapper">
    <!-- Animated background elements -->
    <div class="mesh-gradient"></div>
    <div class="floating-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <div class="login-container">
        <div class="glass-card fade-in" style="padding: 3.5rem 3rem;">
            <!-- Branding/Header -->
            <div class="login-header" style="text-align: center; margin-bottom: 3rem;">
                <div class="logo-outer"
                    style="width: 72px; height: 72px; margin: 0 auto 1.5rem; padding: 4px; background: rgba(255, 255, 255, 0.05); border-radius: 20px; border: 1px solid var(--glass-border);">
                    <div class="logo-inner"
                        style="width: 100%; height: 100%; background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%); border-radius: 16px; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);">
                        <i class="fas fa-graduation-cap" style="font-size: 2rem; color: white;"></i>
                    </div>
                </div>
                <h1 style="font-size: 2.25rem;">Learnbridge <span class="gradient-text">AI</span></h1>
                <p style="color: var(--text-muted); margin-top: 0.75rem;">Empowering Intelligence through Adaptive
                    Learning</p>
            </div>

            <!-- Login Form -->
            <form method="post" action="{% url 'login' %}" class="login-form">
                {% csrf_token %}

                {% if form.errors %}
                <div class="error-banner">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10" />
                        <line x1="12" y1="8" x2="12" y2="12" />
                        <line x1="12" y1="16" x2="12.01" y2="16" />
                    </svg>
                    <span>Invalid username or password. Please try again.</span>
                </div>
                {% endif %}

                <div class="input-group">
                    <label for="username">Username</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                            <circle cx="12" cy="7" r="4" />
                        </svg>
                        <input type="text" id="username" name="username" placeholder="Enter your username" required>
                    </div>
                </div>

                <div class="input-group">
                    <div
                        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                        <label for="password" style="margin: 0;">Password</label>
                        <a href="#" class="forgot-link">Forgot?</a>
                    </div>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                        </svg>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-container">
                        <input type="checkbox" name="remember">
                        <span class="checkmark"></span>
                        Remember me
                    </label>
                </div>

                <button type="submit" class="submit-btn">
                    <span>Sign In</span>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14M12 5l7 7-7 7" />
                    </svg>
                </button>
            </form>

            <div class="login-footer">
                <p>New to Learnbridge? <a href="#">Create account</a></p>
            </div>
        </div>
    </div>
</div>

<style>
    /* Premium Design Tokens */
    :root {
        --glass-bg: rgba(15, 23, 42, 0.65);
        --glass-border: rgba(255, 255, 255, 0.08);
        --accent-glow: rgba(99, 102, 241, 0.5);
    }

    /* Hide footer and nav on login page */
    footer,
    .main-nav {
        display: none !important;
    }

    .login-wrapper {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        background: #0f172a;
        background-image: url("{% static 'core/login_bg.png' %}");
        background-size: cover;
        background-position: center;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        overflow: hidden;
    }

    .mesh-gradient {
        position: absolute;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at 20% 30%, rgba(99, 102, 241, 0.15) 0%, transparent 40%),
            radial-gradient(circle at 80% 70%, rgba(236, 72, 153, 0.15) 0%, transparent 40%);
        pointer-events: none;
    }

    .floating-shapes .shape {
        position: absolute;
        border-radius: 50%;
        filter: blur(80px);
        z-index: 1;
        opacity: 0.4;
        animation: rotate 20s infinite linear;
    }

    .shape-1 {
        width: 400px;
        height: 400px;
        background: var(--primary);
        top: -100px;
        left: -100px;
    }

    .shape-2 {
        width: 300px;
        height: 300px;
        background: var(--secondary);
        bottom: -50px;
        right: -50px;
    }

    .shape-3 {
        width: 250px;
        height: 250px;
        background: #6366f1;
        top: 40%;
        left: 60%;
    }

    @keyframes rotate {
        from {
            transform: rotate(0deg) translate(0, 0);
        }

        to {
            transform: rotate(360deg) translate(20px, 20px);
        }
    }

    .login-container {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 480px;
        padding: 20px;
        animation: modalSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes modalSlideUp {
        from {
            opacity: 0;
            transform: translateY(40px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .glass-login-card {
        background: var(--glass-bg);
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        border: 1px solid var(--glass-border);
        border-radius: 28px;
        padding: 3.5rem 3rem;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .login-header {
        text-align: center;
        margin-bottom: 3rem;
    }

    .logo-outer {
        width: 72px;
        height: 72px;
        margin: 0 auto 1.5rem;
        padding: 4px;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .logo-inner {
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
    }

    .login-header h1 {
        font-size: 2.25rem;
        font-weight: 800;
        color: white;
        margin: 0;
        letter-spacing: -0.02em;
    }

    .accent-text {
        background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .subtitle {
        color: #94a3b8;
        font-size: 1rem;
        margin-top: 0.75rem;
    }

    .error-banner {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.3);
        color: #fca5a5;
        padding: 1rem;
        border-radius: 12px;
        margin-bottom: 2rem;
        font-size: 0.9rem;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        animation: shake 0.4s cubic-bezier(.36, .07, .19, .97) both;
    }

    @keyframes shake {

        10%,
        90% {
            transform: translate3d(-1px, 0, 0);
        }

        20%,
        80% {
            transform: translate3d(2px, 0, 0);
        }

        30%,
        50%,
        70% {
            transform: translate3d(-4px, 0, 0);
        }

        40%,
        60% {
            transform: translate3d(4px, 0, 0);
        }
    }

    .input-group {
        margin-bottom: 1.5rem;
    }

    .input-group label {
        display: block;
        font-size: 0.9rem;
        font-weight: 600;
        color: #e2e8f0;
        margin-bottom: 0.75rem;
    }

    .input-wrapper {
        position: relative;
        transition: transform 0.2s;
    }

    .input-wrapper:focus-within {
        transform: translateY(-2px);
    }

    .input-icon {
        position: absolute;
        left: 1.25rem;
        top: 50%;
        transform: translateY(-50%);
        color: #64748b;
        transition: color 0.2s;
    }

    .input-wrapper input {
        width: 100%;
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 14px;
        padding: 1rem 1rem 1rem 3.5rem;
        color: white;
        font-size: 1rem;
        outline: none;
        transition: all 0.2s;
        box-sizing: border-box;
    }

    .input-wrapper input:focus {
        border-color: var(--primary);
        background: rgba(15, 23, 42, 0.8);
        box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
    }

    .input-wrapper input:focus+.input-icon {
        color: var(--primary);
    }

    .forgot-link {
        color: var(--primary);
        font-size: 0.85rem;
        text-decoration: none;
        font-weight: 600;
        transition: opacity 0.2s;
    }

    .forgot-link:hover {
        opacity: 0.8;
        text-decoration: underline;
    }

    .form-options {
        margin-bottom: 2.5rem;
    }

    .checkbox-container {
        display: flex;
        align-items: center;
        position: relative;
        padding-left: 30px;
        cursor: pointer;
        font-size: 0.9rem;
        color: #94a3b8;
        user-select: none;
    }

    .checkbox-container input {
        position: absolute;
        opacity: 0;
        cursor: pointer;
        height: 0;
        width: 0;
    }

    .checkmark {
        position: absolute;
        top: 0;
        left: 0;
        height: 20px;
        width: 20px;
        background-color: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 6px;
        transition: all 0.2s;
    }

    .checkbox-container:hover input~.checkmark {
        background-color: rgba(255, 255, 255, 0.1);
    }

    .checkbox-container input:checked~.checkmark {
        background-color: var(--primary);
        border-color: var(--primary);
    }

    .checkmark:after {
        content: "";
        position: absolute;
        display: none;
        left: 6px;
        top: 2px;
        width: 5px;
        height: 10px;
        border: solid white;
        border-width: 0 2px 2px 0;
        transform: rotate(45deg);
    }

    .checkbox-container input:checked~.checkmark:after {
        display: block;
    }

    .submit-btn {
        width: 100%;
        background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
        color: white;
        border: none;
        border-radius: 14px;
        padding: 1.1rem;
        font-size: 1.1rem;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
        box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.3);
    }

    .submit-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 15px 30px -5px rgba(99, 102, 241, 0.4);
        filter: brightness(1.1);
    }

    .submit-btn:active {
        transform: translateY(0);
    }

    .login-footer {
        text-align: center;
        margin-top: 2.5rem;
        color: #64748b;
        font-size: 0.95rem;
    }

    .login-footer a {
        color: white;
        text-decoration: none;
        font-weight: 700;
        margin-left: 0.5rem;
        transition: color 0.2s;
    }

    .login-footer a:hover {
        color: var(--primary);
    }

    /* Responsive adjustments */
    @media (max-width: 480px) {
        .glass-login-card {
            padding: 2.5rem 1.5rem;
            border-radius: 0;
        }

        .login-wrapper {
            background-attachment: scroll;
        }
    }
</style>
{% endblock %}
