<div id="ai-chat-widget" class="fixed-bottom-right">
    <!-- Chat Button -->
    <button id="chat-toggle-btn"
        class="btn btn-primary rounded-circle shadow-lg p-0 d-flex align-items-center justify-content-center"
        style="width: 60px; height: 60px; transition: transform 0.3s;">
        <i class="fas fa-robot fs-3"></i>
    </button>

    <!-- Chat Window -->
    <div id="chat-window" class="card shadow-lg glass-panel d-none"
        style="width: 350px; height: 500px; position: absolute; bottom: 80px; right: 0; display: flex; flex-direction: column;">

        <!-- Header -->
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h6 class="mb-0"><i class="fas fa-graduation-cap me-2"></i>Unit Assistant</h6>
            <button id="chat-close-btn" class="btn btn-sm text-white"><i class="fas fa-times"></i></button>
        </div>

        <!-- Messages Area -->
        <div id="chat-messages" class="card-body overflow-auto flex-grow-1 p-3" style="background: rgba(0,0,0,0.2);">
            <div class="d-flex justify-content-start mb-3">
                <div class="bg-dark text-light p-2 rounded shadow-sm" style="max-width: 80%;">
                    Hello! I'm your academic assistant for this unit. How can I help you understand the syllabus?
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="card-footer p-2">
            <div class="input-group">
                <input type="text" id="chat-input" class="form-control" placeholder="Ask a question..."
                    style="background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2);">
                <button id="chat-send-btn" class="btn btn-primary"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>
</div>

<style>
    .fixed-bottom-right {
        position: fixed;
        bottom: 30px;
        right: 30px;
        z-index: 1000;
    }

    .glass-panel {
        background: rgba(23, 23, 30, 0.95);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .user-msg {
        background: var(--primary);
        color: white;
        align-self: flex-end;
    }

    .ai-msg {
        background: #333;
        color: #eee;
        align-self: flex-start;
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const widget = document.getElementById('ai-chat-widget');
        const toggleBtn = document.getElementById('chat-toggle-btn');
        const closeBtn = document.getElementById('chat-close-btn');
        const chatWindow = document.getElementById('chat-window');
        const sendBtn = document.getElementById('chat-send-btn');
        const input = document.getElementById('chat-input');
        const messages = document.getElementById('chat-messages');
        const unitId = "{{ unit.id }}"; // Context from parent template

        // Toggle Chat
        toggleBtn.addEventListener('click', () => {
            chatWindow.classList.toggle('d-none');
            toggleBtn.style.transform = chatWindow.classList.contains('d-none') ? 'rotate(0deg)' : 'rotate(45deg)';
        });

        closeBtn.addEventListener('click', () => {
            chatWindow.classList.add('d-none');
            toggleBtn.style.transform = 'rotate(0deg)';
        });

        // Send Message
        async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;

            // Append User Message
            appendMessage(text, 'user');
            input.value = '';

            // Loading state
            const loadingId = appendMessage('Thinking...', 'ai', true);

            try {
                const response = await fetch(`/course/unit/${unitId}/chat/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': '{{ csrf_token }}'
                    },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();

                // Remove loading
                document.getElementById(loadingId).remove();

                if (data.error) {
                    appendMessage('Error: ' + data.error, 'ai');
                } else {
                    appendMessage(data.response, 'ai');
                }

            } catch (error) {
                document.getElementById(loadingId).remove();
                appendMessage('Network error. Please try again.', 'ai');
                console.error(error);
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        function appendMessage(text, sender, isLoading = false) {
            const div = document.createElement('div');
            const align = sender === 'user' ? 'justify-content-end' : 'justify-content-start';
            const bg = sender === 'user' ? 'bg-primary text-white' : 'bg-dark text-light';
            const id = 'msg-' + Date.now();

            div.id = id;
            div.className = `d-flex ${align} mb-2 fade-in`;
            div.innerHTML = `
                <div class="${bg} p-2 rounded shadow-sm" style="max-width: 80%; word-wrap: break-word;">
                    ${text.replace(/\n/g, '<br>')}
                </div>
            `;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
            return id;
        }
    });
</script>
