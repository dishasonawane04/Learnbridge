{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Studying: {{ deck.title }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #8b5cf6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Header */
        header {
            width: 100%;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .back-link {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--text-main);
        }

        .progress-container {
            flex: 1;
            max-width: 400px;
            margin: 0 2rem;
            text-align: center;
        }

        .progress-bar {
            height: 6px;
            background: #334155;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 0.5rem;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Flashcard Container */
        .study-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            width: 100%;
            perspective: 1000px;
            padding: 2rem;
        }

        .flashcard {
            width: 600px;
            height: 400px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            background: var(--bg-card);
            border: 1px solid #334155;
            border-radius: 24px;
            padding: 3rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
        }

        .card-back {
            transform: rotateY(180deg);
            border-color: var(--accent);
        }

        .card-content {
            font-size: 1.8rem;
            line-height: 1.5;
            margin-bottom: 2rem;
        }

        .card-label {
            position: absolute;
            top: 2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .voice-btn {
            position: absolute;
            top: 2rem;
            right: 2rem;
            background: rgba(255, 255, 255, 0.05);
            border: none;
            color: var(--text-muted);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.2s;
        }

        .voice-btn:hover {
            background: var(--accent);
            color: white;
        }

        .hint-text {
            font-size: 1rem;
            color: var(--text-muted);
            margin-top: 1rem;
        }

        /* Controls */
        .controls {
            margin-top: 3rem;
            display: flex;
            gap: 1.5rem;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s;
            pointer-events: none;
        }

        .controls.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .btn-control {
            border: none;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.3rem;
            width: 120px;
        }

        .btn-again {
            background: var(--danger);
        }

        .btn-hard {
            background: var(--warning);
        }

        .btn-easy {
            background: var(--success);
        }

        .btn-control:hover {
            transform: translateY(-3px);
            filter: brightness(1.1);
        }

        .btn-explain {
            margin-top: 2rem;
            background: transparent;
            border: 1px solid var(--text-muted);
            color: var(--text-muted);
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            display: none;
            /* Shown on back */
        }

        .btn-explain:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Explanation Modal */
        .explanation-box {
            position: absolute;
            bottom: -100%;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            background: #2D3748;
            padding: 1.5rem;
            border-radius: 16px 16px 0 0;
            border: 1px solid #4A5568;
            transition: bottom 0.4s;
            z-index: 50;
        }

        .explanation-box.active {
            bottom: 0;
        }
    </style>
</head>

<body>

    <header>
        <a href="{% url 'flashcard_generator:flashcard_home' %}" class="back-link">
            <i class="ph ph-arrow-left"></i> Exit
        </a>
        <div class="progress-container">
            <div id="progressText">Card 1 / --</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressBar"></div>
            </div>
        </div>
        <button class="btn-control"
            style="background: transparent; color: var(--danger); border: 1px solid var(--danger); padding: 0.5rem 1rem; width: auto; font-size: 0.9rem;"
            onclick="deleteCard()">
            <i class="ph ph-trash"></i> Delete
        </button>
    </header>

    <div class="study-area">
        <div class="flashcard" id="flashcard" onclick="flipCard()">
            <!-- Front -->
            <div class="card-face card-front">
                <div class="card-label">Question</div>
                <button class="voice-btn" onclick="speakText(event, 'front')"><i
                        class="ph ph-speaker-high"></i></button>
                <div class="card-content" id="cardFront">Loading...</div>
                <div class="hint-text">Click to flip</div>
            </div>

            <!-- Back -->
            <div class="card-face card-back">
                <div class="card-label">Answer</div>
                <button class="voice-btn" onclick="speakText(event, 'back')"><i class="ph ph-speaker-high"></i></button>
                <div class="card-content" id="cardBack">...</div>

                <button class="btn-explain" id="explainBtn" onclick="explainAgain(event)">
                    <i class="ph ph-sparkle"></i> Explain Again
                </button>

                <div id="examTipBox"
                    style="margin-top: 1.5rem; background: rgba(16, 185, 129, 0.1); border: 1px solid var(--success); padding: 0.8rem; border-radius: 8px; font-size: 0.9rem; color: var(--success); display: none; align-items: start; gap: 0.5rem; text-align: left;">
                    <i class="ph ph-lightbulb" style="font-size: 1.2rem; flex-shrink: 0;"></i>
                    <span id="examTipText"></span>
                </div>
            </div>
        </div>

        <div class="controls" id="controls">
            <button class="btn-control btn-again" onclick="rateCard('hard')">
                <span>Again</span>
                <span style="font-size: 0.8rem; opacity: 0.8;">&lt; 1min</span>
            </button>
            <button class="btn-control btn-hard" onclick="rateCard('medium')">
                <span>Hard</span>
                <span style="font-size: 0.8rem; opacity: 0.8;">2 days</span>
            </button>
            <button class="btn-control btn-easy" onclick="rateCard('easy')">
                <span>Easy</span>
                <span style="font-size: 0.8rem; opacity: 0.8;">4 days</span>
            </button>

        </div>
    </div>

    <!-- AI Explanation Slide-up -->
    <div class="explanation-box" id="explanationBox">
        <div style="display: flex; justify-content: space-between; margin-bottom: 1rem;">
            <h3 style="margin:0; color: var(--accent);"><i class="ph ph-robot"></i> AI Explanation</h3>
            <i class="ph ph-x" style="cursor: pointer;" onclick="closeExplanation()"></i>
        </div>
        <div id="explanationContent" style="line-height: 1.6; color: #E2E8F0;">
            Thinking...
        </div>
    </div>

    <script>
        const deckId = {{ deck.id }};
        let cards = [];
        let currentIndex = 0;
        let isFlipped = false;

        // Load Cards
        async function loadCards() {
            try {
                const res = await fetch(`/flashcards/api/deck/${deckId}/`);
                const data = await res.json();
                cards = data.cards;
                updateUI();
            } catch (err) {
                console.error(err);
                document.getElementById('cardFront').innerText = "Error loading cards.";
            }
        }

        function updateUI() {
            if (currentIndex >= cards.length) {
                // End of session
                document.querySelector('.study-area').innerHTML = `
                    <div style="text-align: center;">
                        <i class="ph ph-check-circle" style="font-size: 4rem; color: var(--success); margin-bottom: 1rem;"></i>
                        <h2>Session Complete!</h2>
                        <p class="text-muted">You've reviewed all cards for now.</p>
                        
                        <div style="display: flex; gap: 1rem; justify-content: center; margin-top: 2rem;">
                            <a href="{% url 'flashcard_generator:flashcard_home' %}" class="btn-control btn-easy" style="text-decoration: none; width: auto; padding: 1rem 2rem;">Back to Home</a>
                            
                            <form action="{% url 'flashcard_generator:generate_quiz_view' deck.id %}" method="POST" style="margin:0;" onsubmit="this.querySelector('button').innerHTML = '<i class=\'ph ph-spinner ph-spin\'></i> Generating...'; this.querySelector('button').disabled = true;">
                                {% csrf_token %}
                                <button type="submit" class="btn-control btn-hard" style="width: auto; padding: 1rem 2rem; background: var(--accent);">
                                    <i class="ph ph-lightning"></i> Take a Quiz
                                </button>
                            </form>
                        </div>
                    </div>
                `;
                document.getElementById('controls').classList.remove('visible');
                return;
            }

            const card = cards[currentIndex];
            document.getElementById('cardFront').innerText = card.front;
            document.getElementById('cardBack').innerText = card.back;
            document.getElementById('progressText').innerText = `Card ${currentIndex + 1} / ${cards.length}`;
            document.getElementById('progressBar').style.width = `${((currentIndex + 1) / cards.length) * 100}%`;

            // Reset state
            isFlipped = false;
            document.getElementById('flashcard').classList.remove('flipped');
            document.getElementById('controls').classList.remove('visible');
            document.getElementById('explainBtn').style.display = 'none';

            // Exam Tip Handling
            const tipBox = document.getElementById('examTipBox');
            if (card.exam_tip) {
                document.getElementById('examTipText').innerText = card.exam_tip;
                // Only show on back (handled by card flip, but we set content here)
            } else {
                tipBox.style.display = 'none';
            }
        }

        function flipCard() {
            if (isFlipped) return;
            isFlipped = true;
            document.getElementById('flashcard').classList.add('flipped');
            document.getElementById('controls').classList.add('visible');

            // Show tip if exists
            const card = cards[currentIndex];
            if (card.exam_tip) {
                document.getElementById('examTipBox').style.display = 'flex';
            }

            // Show explain button after a short delay
            setTimeout(() => {
                document.getElementById('explainBtn').style.display = 'inline-flex';
            }, 300);
        }

        async function rateCard(outcome) {
            const card = cards[currentIndex];
            // Optimistic UI update
            currentIndex++;
            updateUI();

            // Send to backend
            await fetch(`/flashcards/api/card/${card.id}/progress/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ outcome: outcome })
            });
        }

        function speakText(e, side) {
            e.stopPropagation();
            const text = document.getElementById(side === 'front' ? 'cardFront' : 'cardBack').innerText;
            const utterance = new SpeechSynthesisUtterance(text);
            window.speechSynthesis.speak(utterance);
        }

        async function explainAgain(e) {
            e.stopPropagation();
            const box = document.getElementById('explanationBox');
            const content = document.getElementById('explanationContent');
            const card = cards[currentIndex];

            box.classList.add('active');
            content.innerText = "Thinking...";

            try {
                const res = await fetch(`/flashcards/api/card/${card.id}/explain/`, { method: 'POST' });
                const data = await res.json();
                if (data.error) {
                    content.innerText = "Error: " + data.error;
                } else {
                    content.innerText = data.explanation;
                }
            } catch (err) {
                console.error(err);
                content.innerText = "Connection error. Please try again.";
            }
        }

        async function deleteCard() {
            if (!confirm("Are you sure you want to delete this flashcard?")) return;

            const card = cards[currentIndex];
            try {
                const res = await fetch(`/flashcards/api/card/${card.id}/delete/`, {
                    method: 'DELETE',
                    headers: {
                        'X-CSRFToken': getCookie('csrftoken')
                    }
                });

                if (res.ok) {
                    cards.splice(currentIndex, 1);
                    if (cards.length === 0) {
                        document.querySelector('.study-area').innerHTML = `
                            <div style="text-align: center;">
                                <i class="ph ph-check-circle" style="font-size: 4rem; color: var(--success); margin-bottom: 1rem;"></i>
                                <h2>Session Complete!</h2>
                                <p class="text-muted">You've reviewed all cards for now.</p>
                                
                                <div style="display: flex; gap: 1rem; justify-content: center; margin-top: 2rem;">
                                    <a href="{% url 'flashcard_home' %}" class="btn-control btn-easy" style="text-decoration: none; width: auto; padding: 1rem 2rem;">Back to Home</a>
                                    
                                    <form action="{% url 'generate_quiz' deck.id %}" method="POST" style="margin:0;">
                                        {% csrf_token %}
                                        <button type="submit" class="btn-control btn-hard" style="width: auto; padding: 1rem 2rem; background: var(--accent);">
                                            <i class="ph ph-lightning"></i> Take a Quiz
                                        </button>
                                    </form>
                                </div>
                            </div>
                        `;
                        document.getElementById('controls').classList.remove('visible');
                    } else {
                        if (currentIndex >= cards.length) currentIndex = cards.length - 1;
                        updateUI();
                    }
                } else {
                    alert("Failed to delete card.");
                }
            } catch (err) {
                console.error(err);
                alert("Error deleting card.");
            }
        }

        // Helper to get CSRF token
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        function closeExplanation() {
            document.getElementById('explanationBox').classList.remove('active');
        }

        // Init
        loadCards();

    </script>
</body>

</html>
