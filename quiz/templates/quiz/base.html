<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LearnBridge | Student Assessment</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ================= INLINE STYLES ================= -->
    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #111827;
        }

        /* ===== NAVBAR ===== */
        .navbar {
            background: #2563eb;
            padding: 16px 0;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .nav-container {
            max-width: 1100px;
            margin: auto;
            padding: 0 20px;
            display: flex;
            align-items: center;
        }

        .logo {
            color: white;
            font-size: 22px;
            font-weight: bold;
        }

        /* ===== MAIN CONTAINER ===== */
        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* ===== CARD ===== */
        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.08);
            margin-bottom: 30px;
        }

        /* ===== BUTTONS ===== */
        .btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        .btn-small {
            background: #e5e7eb;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
        }

        .btn-small:hover {
            background: #d1d5db;
        }

        /* ===== QUIZ ===== */
        .question-block {
            margin-bottom: 15px;
        }

        .question-block p {
            margin-bottom: 8px;
        }

        /* ===== PROGRESS BAR ===== */
        .progress-container {
            width: 100%;
            height: 8px;
            background: #e5e7eb;
            border-radius: 6px;
            margin: 15px 0;
            overflow: hidden;
        }

        #progress-bar {
            height: 100%;
            width: 0%;
            background: #2563eb;
            transition: width 0.3s ease;
        }

        /* ===== RESULT PAGE ===== */
        .correct {
            color: #16a34a;
            font-weight: bold;
        }

        .wrong {
            color: #dc2626;
            font-weight: bold;
        }

        .explanation {
            display: none;
            background: #f9fafb;
            border-left: 4px solid #2563eb;
            padding: 10px;
            margin-top: 8px;
            border-radius: 4px;
            font-size: 14px;
        }

        /* ===== HOME PAGE ===== */
        .home-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .home-header h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #6b7280;
            font-size: 16px;
        }

        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }

        .subject-card {
            background: white;
            padding: 22px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        .subject-card h3 {
            margin-bottom: 8px;
        }

        .subject-desc {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 15px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .home-header h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

<!-- ================= NAVBAR ================= -->
<div class="navbar">
    <div class="nav-container">
        <div class="logo">LearnBridge</div>
    </div>
</div>

<!-- ================= MAIN CONTENT ================= -->
<div class="container">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
