<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LearnBridge | Student Assessment</title>

    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #222;
        }

        /* ===== NAVBAR ===== */
        .navbar {
            background: #2563eb;
            color: white;
            padding: 18px 30px;
            font-size: 22px;
            font-weight: 600;
        }

        /* ===== HOME CONTAINER ===== */
        .home-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 50px 20px;
        }

        .home-header {
            text-align: center;
            margin-bottom: 50px;
        }

        .home-header h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 16px;
            color: #555;
        }

        /* ===== SUBJECT SECTION ===== */
        .subjects-section h2 {
            margin-bottom: 25px;
            font-size: 24px;
        }

        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .subject-card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .subject-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.12);
        }

        .subject-card h3 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .subject-desc {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            padding: 10px 18px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s ease;
        }

        .btn:hover {
            background: #1e40af;
        }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            padding: 30px;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>

<body>

<!-- ===== NAVBAR ===== -->
<div class="navbar">
    LearnBridge
</div>

<!-- ===== HOME PAGE ===== -->
<div class="home-container">

    <div class="home-header">
        <h1>Student Assessment</h1>
        <p class="subtitle">
            AI-powered quizzes with adaptive difficulty and instant feedback
        </p>
    </div>

    <div class="subjects-section">
        <h2>Select a Subject</h2>

        <div class="subjects-grid">
            {% for sub in subjects %}
            <div class="subject-card">
                <h3>{{ sub.name }}</h3>

                <p class="subject-desc">
                    Adaptive quiz • Beginner → Advanced
                </p>

                <a href="{% url 'quiz' %}?subject={{ sub.key }}" class="btn">
                    Start Quiz
                </a>
            </div>
            {% endfor %}
        </div>
    </div>

</div>

<div class="footer">
    © 2026 LearnBridge • AI Learning Platform
</div>

</body>
</html>
