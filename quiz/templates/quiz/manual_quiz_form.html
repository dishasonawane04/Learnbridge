{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="glass-card p-5" style="max-width: 800px; margin: 0 auto;">
        <h2 class="mb-4">Create Manual Quiz for {{ course.title }}</h2>

        <form method="POST">
            {% csrf_token %}

            <div class="mb-4">
                <label class="form-label text-light">Question Text</label>
                {{ form.question }}
            </div>

            <div class="row mb-4">
                <div class="col-md-6 mb-3">
                    <label class="form-label text-light">Option 1</label>
                    {{ form.option1 }}
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label text-light">Option 2</label>
                    {{ form.option2 }}
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label text-light">Option 3</label>
                    {{ form.option3 }}
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label text-light">Option 4</label>
                    {{ form.option4 }}
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label text-light">Correct Option</label>
                {{ form.correct_option }}
            </div>

            <div class="mb-4">
                <label class="form-label text-light">Explanation (Optional)</label>
                {{ form.explanation }}
            </div>

            <div class="d-flex justify-content-between">
                <a href="{% url 'course:course_dashboard' course.id %}" class="btn btn-secondary">Done & Exit</a>
                <button type="submit" class="btn btn-primary">Add Question & Continue</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
