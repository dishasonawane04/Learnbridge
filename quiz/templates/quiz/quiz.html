{% extends 'base.html' %}

{% block content %}
<div class="glass-card fade-in" style="max-width: 900px; margin: 0 auto;">

    <!-- Header -->
    <div
        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 1px solid rgba(255, 255, 255, 0.1);">
        <div>
            <h2
                style="font-size: 2rem; margin-bottom: 0.5rem; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;">
                {{ subject }} Quiz
            </h2>
            <p style="color: var(--text-light);">Answer all questions and submit when ready</p>
        </div>
        <div class="badge badge-primary" style="padding: 0.75rem 1.5rem; font-size: 1rem;">
            {{ questions|length }} Questions
        </div>
    </div>

    <!-- Quiz Form -->
    <form method="post" id="quizForm">
        {% csrf_token %}

        {% for q in questions %}
        <div class="question-card"
            style="background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 2rem; margin-bottom: 2rem;">

            <h3 style="font-size: 1.2rem; font-weight: 600; margin-bottom: 1.5rem; color: var(--text-main);">
                <span style="color: var(--primary); margin-right: 0.75rem;">{{ forloop.counter }}.</span>
                {{ q.question }}
            </h3>

            <div class="options-group">
                {% for opt in q.options %}
                <label class="option-label"
                    style="display: flex; align-items: center; gap: 1rem; padding: 1rem 1.25rem; margin-bottom: 0.75rem; background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 8px; cursor: pointer; transition: all 0.2s;">
                    <input type="radio" name="q{{ forloop.parentloop.counter0 }}" value="{{ opt }}"
                        style="width: 1.2rem; height: 1.2rem; cursor: pointer; accent-color: var(--primary);">
                    <span style="font-size: 1rem; color: var(--text-main);">{{ opt }}</span>
                </label>
                {% endfor %}
            </div>
        </div>
        {% endfor %}

        <!-- Submit Button -->
        <div style="text-align: center; margin-top: 3rem;">
            <button type="submit" class="btn btn-primary"
                style="font-size: 1.1rem; padding: 1rem 3rem; background: linear-gradient(135deg, var(--success), #16a34a);">
                Submit Quiz
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    style="margin-left: 0.5rem; vertical-align: middle;">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </button>
        </div>
    </form>
</div>

<style>
    .option-label:hover {
        background: rgba(255, 255, 255, 0.05) !important;
        border-color: var(--primary) !important;
    }

    .option-label:has(input:checked) {
        background: rgba(99, 102, 241, 0.15) !important;
        border-color: var(--primary) !important;
    }
</style>
{% endblock %}
