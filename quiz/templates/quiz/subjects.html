{% extends 'base.html' %}

{% block content %}
<div class="fade-in" style="max-width: 1000px; margin: 0 auto; padding-top: 2rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
        <h1
            style="font-size: 2rem; margin-bottom: 0.5rem; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;">
            Choose Your Subject
        </h1>
        <p style="color: var(--text-light); font-size: 1rem;">Select a topic to test your knowledge</p>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem;">
        {% for subject in subjects %}
        <a href="{% url 'quiz_start' %}?subject={{ subject.key }}" style="text-decoration: none;">
            <div class="subject-card"
                style="background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; padding: 1.5rem; text-align: center; transition: all 0.3s; cursor: pointer;">
                <div style="font-size: 2.5rem; margin-bottom: 0.8rem;">{{ subject.icon }}</div>
                <h3 style="font-size: 1.2rem; margin-bottom: 0.4rem; color: var(--text-main);">{{ subject.name }}</h3>
                <p style="color: var(--text-dim); font-size: 0.85rem;">5 Random Questions</p>
            </div>
        </a>
        {% endfor %}
    </div>
</div>

<style>
    .subject-card:hover {
        transform: translateY(-5px);
        background: rgba(255, 255, 255, 0.05) !important;
        border-color: var(--primary) !important;
        box-shadow: 0 10px 30px rgba(99, 102, 241, 0.2);
    }
</style>
{% endblock %}
