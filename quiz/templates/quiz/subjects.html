{% extends 'base.html' %}

{% block content %}
<div class="fade-in" style="max-width: 1000px; margin: 0 auto; padding: 2rem 1rem;">
    <!-- Quiz Header/Logo -->
    <div style="text-align: center; margin-bottom: 4rem;">
        <div
            style="display: inline-flex; align-items: center; justify-content: center; width: 80px; height: 80px; background: rgba(99, 102, 241, 0.1); border-radius: 20px; border: 2px solid rgba(99, 102, 241, 0.3); margin-bottom: 1.5rem; font-size: 2.5rem; color: var(--primary);">
            <i class="fas fa-clipboard-check"></i>
        </div>
        <h1
            style="font-size: 2.5rem; font-weight: 800; margin-bottom: 0.5rem; background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;">
            Knowledge Check
        </h1>
        <p style="color: var(--text-light); font-size: 1.1rem; max-width: 600px; margin: 0 auto;">Select a subject below
            to test your understanding with AI-generated questions.</p>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 2rem;">
        {% for subject in subjects %}
        <a href="{% url 'quiz_start' %}?subject={{ subject.key }}" style="text-decoration: none;">
            <div class="subject-card"
                style="background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 24px; padding: 2.5rem; text-align: center; transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); cursor: pointer; position: relative; overflow: hidden;">
                <!-- Subtle Inner Glow -->
                <div
                    style="position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.2), transparent);">
                </div>

                <div class="subject-icon-container"
                    style="font-size: 3rem; margin-bottom: 1.5rem; color: var(--primary); transition: transform 0.3s ease;">
                    <i class="{{ subject.icon }}"></i>
                </div>
                <h3 style="font-size: 1.4rem; margin-bottom: 0.75rem; color: var(--text-main); font-weight: 700;">{{ subject.name }}</h3>
                <div
                    style="display: flex; align-items: center; justify-content: center; gap: 0.5rem; color: var(--text-dim); font-size: 0.9rem;">
                    <i class="fas fa-list-ol"></i>
                    <span>5 Questions</span>
                </div>
            </div>
        </a>
        {% endfor %}
    </div>
</div>

<style>
    .subject-card:hover {
        transform: translateY(-8px);
        background: rgba(255, 255, 255, 0.05) !important;
        border-color: rgba(99, 102, 241, 0.5) !important;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), 0 0 20px rgba(99, 102, 241, 0.1);
    }

    .subject-card:hover .subject-icon-container {
        transform: scale(1.1);
        color: var(--accent) !important;
    }
</style>
{% endblock %}
